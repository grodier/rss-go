{{define "html"}}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>
  <div class="container">
    {{with .Flash}}
    <div class="flash">{{.}}</div>
    {{end}}

    <nav class="nav">
      <ul class="nav-list">
        <li class="nav-item"><a href="/" class="nav-link active">Home</a></li>
        <li class="nav-item"><a href="/feeds" class="nav-link">Feeds</a></li>
        <li class="nav-item"><a href="#" class="nav-link">Settings</a></li>
      </ul>
    </nav>

    <main class="main">
      <header class="page-header">
        <h1>Dashboard</h1>
        <p class="page-description">Your latest articles</p>
      </header>

      <section>
        <article>
          <h2>Css Tricks</h2>
        </article>
        <article>
          <h2>Go Lang</h2>
        </article>
      </section>
    </main>
  </div>

</html>
{{end}}
