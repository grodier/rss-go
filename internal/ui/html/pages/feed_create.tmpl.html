<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Home - RSS App</title>
</head>

<body>
  <header>
    <h1><a href="/">Create Feed</a></h1>
  </header>
  <main>
    <nav>
      <div>
        <a href="/">Home</a>
        <a href="/feed/create">Create Feed</a>
      </div>
      <div>
        <a href="/user/signup">Signup</a>
        <a href="/user/login">Login</a>
        <form action="/user/logout" method="POST">
          <button type="submit">Logout</button>
        </form>
      </div>
    </nav>
    <form action="/feed/create" method="POST">
      <div>
        <label>Title:</label>
        <input type="text" name="title" value="{{.Feed.Title}}" />
        {{with .FieldErrors.title}}
        <span style="color: red">{{.}}</span>
        {{end}}
      </div>
      <div>
        <label>Description:</label>
        <textarea name="description">{{.Feed.Description}}</textarea>
        {{with .FieldErrors.description}}
        <span style="color: red">{{.}}</span>
        {{end}}
      </div>
      <div>
        <input type="submit" value="Create Feed" />
      </div>
    </form>
  </main>
  <footer>Powered by <a href="https://golang.org/">Go</a></footer>
</body>

</html>
