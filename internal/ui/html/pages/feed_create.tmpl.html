<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Home - RSS App</title>
</head>

<body>
  <header>
    <h1><a href="/">Create Feed</a></h1>
  </header>
  <main>
    <form action="/feed/create" method="POST">
      <div>
        <label>Title:</label>
        <input type="text" name="title" />
      </div>
      <div>
        <label>Description:</label>
        <textarea name="description"></textarea>
      </div>
      <div>
        <input type="submit" value="Create Feed" />
      </div>
    </form>
  </main>
  <footer>Powered by <a href="https://golang.org/">Go</a></footer>
</body>

</html>
