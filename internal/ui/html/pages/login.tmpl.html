{{define "html"}}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Login - RSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>
  <div class="container">
    {{with .Flash}}
    <div class="flash">{{.}}</div>
    {{end}}

    <main class="main">
      <header class="page-header">
        <h1>Login</h1>
        <p class="page-description">Sign in to your account</p>
      </header>

      <section class="form-section">
        {{range .NonFieldErrors}}
        <div class="error-message">{{.}}</div>
        {{end}}

        <form action="/login" method="POST" novalidate class="auth-form">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
          <input type="hidden" name="redirect" value="{{.Redirect}}" />

          <div class="form-group">
            <label for="email">Email</label>
            {{with .FieldErrors.email}}
            <span class="field-error">{{.}}</span>
            {{end}}
            <input type="email" id="email" name="email" value="{{.User.Email}}" class="form-input" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            {{with .FieldErrors.password}}
            <span class="field-error">{{.}}</span>
            {{end}}
            <input type="password" id="password" name="password" class="form-input" />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="form-footer">
          Don't have an account? <a href="/signup">Sign up</a>
        </p>
      </section>
    </main>
  </div>
</body>

</html>
{{end}}
