<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Home - RSS App</title>
  <script src="/static/js/log.js" type="text/javascript" defer></script>
</head>

<body>
  <header>
    <h1><a href="/">View Feed</a></h1>
  </header>
  <main>
    <nav>
      <div>
        <a href="/">Home</a>
        <a href="/feed/create">Create Feed</a>
      </div>
      <div>
        <a href="/user/signup">Signup</a>
        <a href="/user/login">Login</a>
        <form action="/user/logout" method="POST">
          <button type="submit">Logout</button>
        </form>
      </div>
    </nav>
    {{with .Flash}}
    <div class="flash">{{.}}</div>
    {{end}}
    <h2>{{.Feed.Title}}</h2>
    <p><strong>Feed ID:</strong> {{.Feed.ID}}</p>
    <p><strong>Description:</strong> {{.Feed.Description}}</p>
  </main>
  <footer>Powered by <a href="https://golang.org/">Go</a></footer>
</body>

</html>
