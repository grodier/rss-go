{{define "title"}}Home{{end}} {{define "main"}}
<h2>Latest Feeds</h2>
{{if .Feeds}}
<table>
  <tr>
    <th>Title</th>
    <th>ID</th>
  </tr>
  {{range .Feeds}}
  <tr>
    <td><a href="/feed/view/{{.ID}}">{{.Title}}</a></td>
    <td>#{{.ID}}</td>
  </tr>
  {{end}}
</table>
{{else}}
<p>There's nothing to see here yet!</p>
{{end}} {{end}}
